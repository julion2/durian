[package]
name = "durian-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/ui", "crates/mail", "crates/calendar"]

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3.5" }
rust-embed = { version = "8", features = ["include-exclude"] }
unicode-segmentation = "1"

[dependencies]
ui = { path = "crates/ui" }
mail = { path = "crates/mail" }
calendar = { path = "crates/calendar" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui.workspace = true
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
zlog = { package = "gpui-pre-zlog", version = "=0.3.8" }
anyhow = "1"
rust-embed.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI is CPU-heavy in debug (layout, text shaping): optimize dependencies, keep our crate fast to build
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# AppleFontSmoothing (see main.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
