openapi: 3.0.0
info:
  title: Durian API
  version: 1.0.0
servers:
  - url: http://localhost:9723/api/v1
paths:
  /version:
    get:
      summary: Durian server version and git commit
      description: >
        Returns the version string and short git commit of the running
        `durian serve` process. Useful for the GUI to detect CLI mismatch
        after upgrades.
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /search:
    get:
      summary: Search for emails
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
        - name: enrich
          in: query
          description: Max number of threads to enrich with full content (0 = off)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A list of emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Missing or invalid query / limit / enrich parameter
  /search/count:
    get:
      summary: Count matching threads without fetching them
      description: >
        Returns the number of threads matching the query. Cheaper than
        /search when only the count is needed (e.g. folder unread badges).
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCountResponse'
        '400':
          description: Missing query parameter
        '500':
          description: Store error
  /message/body:
    get:
      summary: Get the full unstripped body of a single message
      description: >
        Returns the raw plain-text body and optional HTML body of the
        message identified by its RFC Message-ID. Used by the compose
        window for reply quoting — the sync path stores stripped bodies
        to save space, but replies need the original.
      parameters:
        - name: id
          in: query
          required: true
          description: RFC Message-ID of the message (including angle brackets)
          schema:
            type: string
      responses:
        '200':
          description: Message body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBodyResponse'
        '400':
          description: Missing id parameter
        '404':
          description: Message not found
  /tags:
    get:
      summary: List all known tags
      parameters:
        - name: account
          in: query
          description: Comma-separated account identifiers to scope tags (omit for all)
          schema:
            type: string
      responses:
        '200':
          description: A list of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
  /local-drafts:
    get:
      summary: List all local crash-recovery drafts
      responses:
        '200':
          description: All local drafts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocalDraft'
  /local-drafts/{id}:
    put:
      summary: Save or update a local draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_json:
                  type: object
                  description: The full EmailDraft JSON blob
              required:
                - draft_json
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
    get:
      summary: Get a local draft by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDraft'
        '404':
          description: Draft not found
    delete:
      summary: Delete a local draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Draft deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: Draft not found
  /threads/{thread_id}:
    get:
      summary: Get a specific email thread
      parameters:
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The email thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
  /events:
    get:
      summary: Server-Sent Events stream for real-time notifications
      description: >
        Long-lived SSE connection. Emits `new_mail` events when IDLE-triggered
        syncs find new messages, and `: heartbeat` comments every 30s.
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/NewMailEvent'
  /messages/{message_id}/attachments/{part_id}:
    get:
      summary: Download a message attachment
      description: >
        Streams the raw bytes of a MIME part. Content-Type and Content-Disposition
        headers are derived server-side from stored message metadata.
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
        - name: part_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Raw attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Message or attachment not found
  /contacts/search:
    get:
      summary: Search contacts by email or name
      parameters:
        - name: query
          in: query
          description: Prefix search on email/name
          schema:
            type: string
        - name: name
          in: query
          description: Exact name match (case-insensitive)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Matching contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '400':
          description: Missing query or name parameter
        '503':
          description: Contacts database not available
  /contacts:
    get:
      summary: List contacts ordered by usage
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Contacts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '503':
          description: Contacts database not available
  /contacts/usage:
    post:
      summary: Increment usage count for emails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageRequest'
      responses:
        '200':
          description: Usage counts updated
        '400':
          description: Invalid request body
        '503':
          description: Contacts database not available
  /outbox/send:
    post:
      summary: Enqueue an email to the outbox for background sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxDraft'
      responses:
        '200':
          description: Email enqueued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                    format: int64
                  send_after:
                    type: integer
                    format: int64
                    description: Unix timestamp after which the worker may send the email (0 = immediate)
        '400':
          description: Invalid request (missing fields)
  /outbox:
    get:
      summary: List all outbox items
      responses:
        '200':
          description: Outbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboxEntry'
  /outbox/{id}:
    delete:
      summary: Delete an outbox item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Item deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: Item not found
  /threads/{thread_id}/tags:
    post:
      summary: Add or remove tags from an email thread
      parameters:
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '200':
          description: The updated tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
  /calendars:
    get:
      summary: List the calendars of an account (read-only, from the local vdir)
      parameters:
        - name: account
          in: query
          required: true
          description: >-
            Account identifier (email, alias or name), or the reserved value
            `local` for the calendars configured under `calendar.local_calendars`.
            Those exist only on disk, belong to no provider and are never synced.
          schema:
            type: string
      responses:
        '200':
          description: The account's calendars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarsResponse'
        '400':
          description: Missing account parameter
        '404':
          description: Account not found
  /calendars/events:
    get:
      summary: List or search calendar events (read-only, from the local vdir)
      description: >-
        Without `q`, returns the events (recurring series expanded into
        occurrences) overlapping [from, to), defaulting to the next 7 days.
        With `q`, returns a full-text search across all events (the window is
        ignored). Events carry only summary fields (no attendees/description).
      parameters:
        - name: account
          in: query
          required: true
          description: >-
            Account identifier (email, alias or name), or the reserved value
            `local` for the calendars configured under `calendar.local_calendars`.
            Those exist only on disk, belong to no provider and are never synced.
          schema:
            type: string
        - name: from
          in: query
          description: Window start (RFC3339, "2006-01-02 15:04", "2006-01-02", today, tomorrow)
          schema:
            type: string
        - name: to
          in: query
          description: Window end (same formats as from)
          schema:
            type: string
        - name: calendar
          in: query
          description: Restrict to a single calendar by display name
          schema:
            type: string
        - name: q
          in: query
          description: Full-text query over subject, location, description and attendees
          schema:
            type: string
      responses:
        '200':
          description: The matching events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventsResponse'
        '400':
          description: Missing account or invalid window
        '404':
          description: Account not found
  /calendars/event:
    get:
      summary: Get one calendar event in detail (read-only, from the local vdir)
      parameters:
        - name: account
          in: query
          required: true
          description: >-
            Account identifier (email, alias or name), or the reserved value
            `local` for the calendars configured under `calendar.local_calendars`.
            Those exist only on disk, belong to no provider and are never synced.
          schema:
            type: string
        - name: ref
          in: query
          required: true
          description: Event reference — iCalUID (exact or prefix) or a unique subject substring
          schema:
            type: string
        - name: calendar
          in: query
          description: Restrict the lookup to a single calendar by display name
          schema:
            type: string
      responses:
        '200':
          description: The event (full detail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        '400':
          description: Missing account or ref
        '404':
          description: Account or event not found (or ambiguous reference)
    put:
      summary: Create or update an event locally (applied to Outlook on next sync)
      description: >-
        Upserts a local .ics from the posted event — a new UID is generated when
        absent (create), otherwise the existing file is overwritten (update).
        Local-first: only the vdir is written; nothing is sent to Outlook until
        the next `durian calendar sync`.

        An all-day event is normalized to midnight-UTC day boundaries and its
        end is snapped to at least start + 1 day (the shape Graph requires).
        An update preserves the existing event's organizer, recurrence, RSVP
        state and online-meeting link. On update, attendees are preserved unless
        replace_attendees is true; that explicitly replaces them with the posted
        list, including an empty list to remove every invitee, and is accepted
        only when the account owns the meeting. An update must target the
        calendar the event already lives in (moving between calendars is
        rejected with 400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventWrite'
      responses:
        '200':
          description: The written event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        '400':
          description: Missing/invalid fields (account, calendar, start/end)
        '403':
          description: Read-only calendar or attendee edit by a non-organizer
        '404':
          description: Account not found
    delete:
      summary: Delete an event locally (applied to Outlook on next sync)
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: true
          description: Event reference — iCalUID (exact or prefix) or a unique subject substring
          schema:
            type: string
        - name: calendar
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '400':
          description: Missing account or ref
        '404':
          description: Account or event not found
  /calendars/rsvp:
    post:
      summary: Set the owner's RSVP on a meeting locally (sent on next sync)
      description: >-
        Sets the account owner's response (accept/tentative/decline) on a
        meeting by rewriting the owner's ATTENDEE PARTSTAT in the local .ics.
        Local-first: only the vdir is written — no provider call, no mail. The
        organizer is notified on the next `durian calendar sync`, which
        previews the reply before sending. Only works when the owner is an
        attendee (not the organizer) of the meeting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarRsvpRequest'
      responses:
        '200':
          description: The updated event (full detail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        '400':
          description: >-
            Missing account/ref, unknown response verb, owner is the organizer,
            or owner is not an attendee of the event
        '404':
          description: Account or event not found (or ambiguous reference)

components:
  schemas:
    VersionResponse:
      type: object
      properties:
        version:
          type: string
          description: Semantic version (e.g. "0.5.0" or "dev")
          example: "0.5.0"
        commit:
          type: string
          description: Short git commit hash
          example: "a1b2c3d"
      required: [version, commit]
    SearchCountResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of threads matching the query
          example: 42
      required: [count]
    MessageBodyResponse:
      type: object
      description: >
        Wraps a single message's body in the standard Durian response envelope.
        Mirrors protocol.Response with only the message_body field populated.
      properties:
        ok:
          type: boolean
        error:
          type: string
        message_body:
          $ref: '#/components/schemas/MessageBody'
    MessageBody:
      type: object
      properties:
        body:
          type: string
          description: Plain-text body (full, unstripped)
        html:
          type: string
          description: HTML body if present, omitted otherwise
      required: [body]
    SearchResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/MailSearchResult'
        threads:
          type: object
          description: Thread content keyed by thread ID (enriched search)
          additionalProperties:
            $ref: '#/components/schemas/ThreadContent'
    ThreadResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        thread:
          $ref: '#/components/schemas/ThreadContent'
    TagsResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        tags:
          type: array
          items:
            type: string
    TagRequest:
      type: object
      properties:
        tags:
          type: string
    TagResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
    NewMailEvent:
      type: object
      properties:
        account:
          type: string
        total_new:
          type: integer
        messages:
          type: array
          items:
            $ref: '#/components/schemas/NewMailInfo'
    NewMailInfo:
      type: object
      properties:
        thread_id:
          type: string
        subject:
          type: string
        from:
          type: string
    MailSearchResult:
      type: object
      properties:
        thread_id:
          type: string
        subject:
          type: string
        from:
          type: string
        date:
          type: string
        timestamp:
          type: integer
        tags:
          type: string
    ThreadContent:
      type: object
      properties:
        thread_id:
          type: string
        subject:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ThreadMessage'
    ThreadMessage:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        cc:
          type: string
        date:
          type: string
        timestamp:
          type: integer
        body:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInfo'
        tags:
          type: array
          items:
            type: string
    Contact:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        last_used:
          type: string
          format: date-time
        usage_count:
          type: integer
        source:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - usage_count
        - source
        - created_at
    UsageRequest:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
      required:
        - emails
    OutboxDraft:
      type: object
      properties:
        from:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        body:
          type: string
        is_html:
          type: boolean
        in_reply_to:
          type: string
        references:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/OutboxAttachment'
        delay_seconds:
          type: integer
          description: Seconds to delay before the worker may send (undo window). 0 = immediate.
          default: 0
      required:
        - from
        - to
        - subject
        - body
    OutboxAttachment:
      type: object
      properties:
        filename:
          type: string
        mime_type:
          type: string
        data_base64:
          type: string
      required:
        - filename
        - mime_type
        - data_base64
    OutboxEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subject:
          type: string
        to:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
    OutboxUpdateEvent:
      type: object
      description: SSE event broadcast when an outbox item changes status
      properties:
        item_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [sent, failed, queued]
        error:
          type: string
        subject:
          type: string
        to:
          type: string
    LocalDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
        draft_json:
          type: object
          description: The full EmailDraft JSON blob
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
    AttachmentInfo:
      type: object
      properties:
        part_id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
        disposition:
          type: string
        content_id:
          type: string
    Calendar:
      type: object
      properties:
        name:
          type: string
          description: Calendar display name
        color:
          type: string
          description: Calendar color as "#RRGGBB" (omitted when none)
        event_count:
          type: integer
          description: Number of master events stored locally
      required: [name, event_count]
    CalendarPerson:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required: [email]
    CalendarAttendee:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        type:
          type: string
          description: required | optional | resource
        response:
          type: string
          description: Graph response (accepted, declined, tentativelyAccepted, none, ...)
      required: [email]
    CalendarEvent:
      type: object
      description: >-
        One event or expanded occurrence. Summary fields are always present;
        organizer, attendees and description are only included by the
        single-event detail endpoint (/calendars/event).
      properties:
        calendar:
          type: string
          description: Display name of the containing calendar
        uid:
          type: string
          description: iCalUID (shared across a recurring series)
        subject:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        all_day:
          type: boolean
        location:
          type: string
        my_response:
          type: string
          description: The account owner's RSVP (accepted, declined, tentative, organizer, none)
        online_meeting:
          type: boolean
        online_meeting_url:
          type: string
        recurring:
          type: boolean
        organizer:
          $ref: '#/components/schemas/CalendarPerson'
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/CalendarAttendee'
        description:
          type: string
      required: [calendar, uid, subject, start, end, all_day]
    CalendarsResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
      required: [ok, calendars]
    CalendarEventsResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
      required: [ok, events]
    CalendarEventResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        event:
          $ref: '#/components/schemas/CalendarEvent'
      required: [ok, event]
    CalendarEventWrite:
      type: object
      description: Body for PUT /calendars/event (create when uid is empty, else update).
      properties:
        account:
          type: string
        calendar:
          type: string
          description: Target calendar display name
        uid:
          type: string
          description: Empty to create a new event; set to update an existing one
        subject:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        all_day:
          type: boolean
        location:
          type: string
        description:
          type: string
        attendees:
          type: array
          items:
            type: string
          description: >-
            Attendee email addresses; new entries become required attendees.
            On update this list is applied only when replace_attendees is true;
            otherwise the existing set is preserved for compatibility with old
            clients. Existing meeting attendees can only be replaced by the
            organizer. Local-first: invitations and attendee updates are sent
            by the next 'durian calendar sync' behind its notification gate.
        replace_attendees:
          type: boolean
          default: false
          description: >-
            On update, replace the stored editable invitees with attendees.
            Requires attendees to be present; an empty list removes all
            invitees. Ignored on create.
        request_online_meeting:
          type: boolean
          default: false
          description: >-
            Create the event with an online meeting (Teams for a Microsoft
            account, Google Meet for a Google one). Honored on create only;
            the provider attaches the meeting when the next
            'durian calendar sync' uploads the event.
      required: [account, calendar, subject, start, end]
    CalendarRsvpRequest:
      type: object
      description: Body for POST /calendars/rsvp (local-first owner RSVP).
      properties:
        account:
          type: string
          description: >-
            Account identifier (email, alias or name), or the reserved value
            `local` for the calendars configured under `calendar.local_calendars`.
            Those exist only on disk, belong to no provider and are never synced.
        calendar:
          type: string
          description: Restrict the event lookup to a single calendar by display name
        ref:
          type: string
          description: Event reference — iCalUID (exact or prefix) or a unique subject substring
        response:
          type: string
          description: >-
            The owner's response — accept/decline/tentative or the Graph-style
            accepted/declined/tentativelyAccepted (case-insensitive)
      required: [account, ref, response]
