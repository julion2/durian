[package]
name = "durian-mail-cef"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "durian-mail-cef"
path = "src/main.rs"

[[bin]]
name = "durian-mail-cef-helper"
path = "src/bin/durian_mail_cef_helper.rs"

[dependencies]
cef = { version = "=154.4.0", default-features = false, features = ["sandbox"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSEvent", "NSResponder"] }

[profile.dev]
debug = 0
