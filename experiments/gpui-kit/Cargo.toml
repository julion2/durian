[package]
name = "durian-gpui-kit"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimental Durian mail UI built with GPUI Kit (longbridge/gpui-kit) — Linux spike"

[[bin]]
name = "durian-gpui-kit"
path = "src/main.rs"

[dependencies]
# gpui-kit pins its own GPUI snapshot (gpui-pre 0.3.x); do not add a separate
# `gpui` dependency here or the types will not line up.
gpui-kit = "0.6.4"
chrono = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "=0.57.0"
raw-window-handle = "0.6"
block2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
image = { version = "0.25", default-features = false, features = ["tiff"] }

[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
